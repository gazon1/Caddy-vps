---
# Remove adsbrowser and adsbrowser-api from the VPS.
#
#   just adsbrowser-cleanup
#   just adsbrowser-cleanup --check  # dry-run first
#
# Removes (in order):
#   1. adsbrowser-api  — stops systemd unit, removes /usr/local/lib/adspower
#   2. adsbrowser      — stops Xvfb, removes adspower-browser files
#
# Does NOT touch:
#   - kotlin-try containers
#   - wbparser container
#   - Caddy proxy

- name: Cleanup adsbrowser and adsbrowser-api from the VPS
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true

  tasks:

    # ── adsbrowser-api ────────────────────────────────────────────────────────

    - name: Stop and disable adsbrowser-api systemd service
      ansible.builtin.systemd:
        name: adsbrowser-api
        enabled: false
        state: stopped
      become: true
      failed_when: false
      changed_when: true

    - name: Remove adsbrowser-api systemd unit
      ansible.builtin.file:
        path: /etc/systemd/system/adsbrowser-api.service
        state: absent
      become: true
      changed_when: true
      notify: Reload systemd

    - name: Remove /usr/local/bin/ads symlink
      ansible.builtin.file:
        path: /usr/local/bin/ads
        state: absent
      become: true
      changed_when: true

    - name: Remove /usr/local/lib/adspower installation directory
      ansible.builtin.file:
        path: /usr/local/lib/adspower
        state: absent
      become: true
      changed_when: true

    # ── adsbrowser ────────────────────────────────────────────────────────────

    - name: Stop and disable Xvfb systemd service
      ansible.builtin.systemd:
        name: xvfb
        enabled: false
        state: stopped
      become: true
      failed_when: false
      changed_when: true

    - name: Remove Xvfb systemd unit
      ansible.builtin.file:
        path: /etc/systemd/system/xvfb.service
        state: absent
      become: true
      changed_when: true
      notify: Reload systemd

    - name: Remove logrotate config
      ansible.builtin.file:
        path: /etc/logrotate.d/adsbrowser
        state: absent
      become: true
      changed_when: true

    - name: Remove /usr/local/bin/adsbrowser symlink
      ansible.builtin.file:
        path: /usr/local/bin/adsbrowser
        state: absent
      become: true
      changed_when: true

    - name: Remove adsbrowser config directory
      ansible.builtin.file:
        path: "{{ adsbrowser_config_dir | default('/opt/adsbrowser') }}"
        state: absent
      changed_when: true

    - name: Remove adsbrowser shell rc snippet
      ansible.builtin.file:
        path: /etc/profile.d/adsbrowser.sh
        state: absent
      become: true
      changed_when: true

    - name: Remove adsbrowser log directory
      ansible.builtin.file:
        path: "{{ adsbrowser_log_dir | default('/var/log/adsbrowser') }}"
        state: absent
      changed_when: true

    - name: Report cleanup completed
      ansible.builtin.debug:
        msg: "Cleanup complete. adsbrowser-api and adsbrowser removed."

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
