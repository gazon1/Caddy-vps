---
# ==============================================================================
# Deploy the wb-parser crawler container from a registry image.
#
#   just deploy                # in the app repo: gates, build, push, then this
#   just wbparser-deploy -e wbparser_tag=<sha>
#
# The tag the operator passes is only a NAME for an image. A tag can be moved;
# a digest names one set of bytes. The storefront that reads this crawler's
# catalog API pins the crawler by digest and is verified against exactly those
# bytes, so this role resolves the tag to a digest first and deploys THAT. The
# digest is what ends up in .env, in the state file, and in every message that
# says what is running.
#
# TWO images are deployed, both by digest:
#
#   wb-parser          the crawler itself
#   wb-parser-browser  the AdsPower runtime (headless Chrome + Local API) the
#                      crawler drives. It comes from the same application
#                      repository and is published under the same tag, so the
#                      operator still passes exactly one tag.
#
# What this role does NOT do, on purpose:
#
#   - it does not clone the repository or build anything. The host has no
#     outbound network, so `git clone` and `./gradlew` both hang until they time
#     out. The artifact arrives as an image pulled by digest.
#   - it does not manage Caddy. The route is handed to roles/caddy/tasks/routes.yml
#     by playbooks/wbparser.yml, which already does backup, validation, rollback
#     and a reachability probe. A second copy of that logic here would be a
#     second thing to keep in step.
#   - it does not report success on a restart alone. The container must reach
#     healthy, and if it does not, the previous digest is restored before the
#     run fails. A deploy that restarts a container which dies 70 ms later is
#     exactly the failure this gate exists to catch.
#   - it does not fall back to `latest`, or to the tag itself, when the tag
#     cannot be resolved. An image that cannot be named is not deployed.
# ==============================================================================

# ── Preflight ────────────────────────────────────────────────────────────────
# Secrets come from the environment, never from -e on a command line that ends
# up in shell history and in the CI log. The app repo's `just deploy` documents
# which ones are required.

- name: Resolve secrets from the environment
  ansible.builtin.set_fact:
    _wbparser_db_password: "{{ lookup('env', 'WBPARSER_DB_PASSWORD') }}"
    _wbparser_admin_password: "{{ lookup('env', 'WBPARSER_ADMIN_PASSWORD') }}"
    _wbparser_admin_api_key: "{{ lookup('env', 'WBPARSER_ADMIN_API_KEY') }}"
    wbparser_registry_user: "{{ lookup('env', 'WBPARSER_GHCR_USER') | default(wbparser_registry_user, true) }}"
    wbparser_registry_token: "{{ lookup('env', 'WBPARSER_GHCR_TOKEN') | default(wbparser_registry_token, true) }}"
  no_log: true

# The AdsPower Local API key, from the same source the adsbrowser roles use:
# the `adsbrowser_api_key` variable the playbook resolves from -e, from
# WBPARSER_ADMIN_API_KEY, or from the vault — and, when this role runs on its
# own, from the environment. The browser runtime starts the Local API with it
# and the crawler authenticates against it with it, so the two must be given
# the same key; one key, one place it is written down.
- name: Resolve the AdsPower Local API key
  ansible.builtin.set_fact:
    # The comparison is parenthesised on purpose: in Jinja `a | length > 0 |
    # ternary(x, y)` parses as `(a|length) > (0|ternary(x, y))`, so the filter
    # binds tighter than the comparison and the condition ends up comparing an
    # int with a string.
    _wbparser_adsbrowser_api_key: >-
      {{
        ((adsbrowser_api_key | default('', true)) | length > 0)
        | ternary(adsbrowser_api_key | default('', true),
                  lookup('env', 'WBPARSER_ADMIN_API_KEY'))
      }}
  no_log: true

- name: Refuse to deploy without a tag
  ansible.builtin.assert:
    that:
      - wbparser_tag | length > 0
    fail_msg: >-
      wbparser_tag is empty. Pass the tag you pushed:
      ansible-playbook playbooks/wbparser.yml -e wbparser_tag=$(git rev-parse --short HEAD)
      The tag is only a name — this role resolves it to a digest and deploys
      that. There is no `latest` fallback on purpose: a deploy that forgot to
      name an image would ship whatever the registry considers newest.

- name: Refuse to deploy without a database password
  ansible.builtin.assert:
    that:
      - _wbparser_db_password | length > 0
    fail_msg: >-
      WBPARSER_DB_PASSWORD is not set in the environment.
      WBPARSER_DB_PASSWORD='…' just wbparser-deploy

- name: Refuse to deploy without an admin password
  ansible.builtin.assert:
    that:
      - _wbparser_admin_password | length > 0
    fail_msg: >-
      WBPARSER_ADMIN_PASSWORD is not set in the environment. The application
      ships an empty default for it, and an empty ADMIN_PASSWORD would leave the
      admin API reachable with a credential nobody chose.
      WBPARSER_ADMIN_PASSWORD='…' just wbparser-deploy

# The browser runtime is a separate image, and a crawler without a browser
# cannot fetch a single page. A missing key is caught here, not by a crawler
# that starts and then fails every fetch.
- name: Refuse to deploy without the AdsPower Local API key
  ansible.builtin.assert:
    that:
      - _wbparser_adsbrowser_api_key | length > 0
    fail_msg: >-
      The AdsPower Local API key is not set. The browser runtime starts the
      Local API with it and the crawler authenticates against it with it, so
      the deploy cannot leave it out. Provide it the way the adsbrowser roles
      take it:
        just wbparser-deploy -e wbparser_tag=<sha> -e adsbrowser_api_key=<key>
        WBPARSER_ADMIN_API_KEY=<key> just wbparser-deploy

# The compose file comes from the application repository. Checked with a lookup
# rather than a delegated stat: delegate_to inherits the host's become, and
# `-e ansible_become=true` outranks a task-level `become: false`, so a delegated
# stat asks the control node for a sudo password it does not need.
- name: Check that the compose source exists on the control node
  ansible.builtin.set_fact:
    _wbparser_compose_readable: >-
      {{ lookup('ansible.builtin.file', wbparser_compose_src, errors='ignore')
         | length > 0 }}
  when: wbparser_compose_src | length > 0

- name: Fail when the compose source is missing
  ansible.builtin.fail:
    msg: >-
      wbparser_compose_src is not set or not readable on the control node
      ({{ wbparser_compose_src | default('unset') }}). It must point at
      deploy/docker-compose.vps.yml in the application checkout — the app repo
      owns the runtime contract, this role only deploys it.
  when: not (_wbparser_compose_readable | default(false) | bool)

# Cheap, fails instantly, and separates "no DNS" from "the pull is slow" — both
# of which otherwise look like one multi-minute hang. The port is stripped
# first: the question is whether the HOST resolves, and a registry that
# carries an explicit port would otherwise be looked up as a host named
# "host:port", which never resolves.
- name: Check that the registry is resolvable
  ansible.builtin.command:
    argv: [getent, hosts, "{{ wbparser_registry | regex_replace(':[0-9]+$', '') }}"]
  register: _wbparser_dns
  changed_when: false
  failed_when: _wbparser_dns.rc != 0
  ignore_errors: true

- name: Fail early when the registry cannot be resolved
  ansible.builtin.fail:
    msg: >-
      {{ wbparser_registry }} does not resolve on this host
      (getent exit {{ _wbparser_dns.rc }}). The container cannot be pulled
      without it — check DNS before anything else.
  when: _wbparser_dns.rc != 0

# ── Registry access ──────────────────────────────────────────────────────────
# Only for a private package. An empty token is not an error: a public package,
# or a host already logged in, needs nothing here — and forcing a login with an
# empty credential would trade a working deploy for a failing one.

- name: Log in to the registry
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ wbparser_registry }}"
      - --username
      - "{{ wbparser_registry_user }}"
      - --password-stdin
    stdin: "{{ wbparser_registry_token }}"
  no_log: true
  when:
    - wbparser_registry_user | length > 0
    - wbparser_registry_token | length > 0
  changed_when: true

# ── Name the image ───────────────────────────────────────────────────────────
# The deploy is by digest from here on. The tag the operator passed is only
# how the image was named; what runs is the digest it pointed at.

- name: Resolve the requested tag to a digest
  ansible.builtin.include_tasks: resolve-digest.yml
  vars:
    wbparser_resolve_ref: "{{ wbparser_image_ref }}:{{ wbparser_tag }}"
    wbparser_resolve_note: >-
      The tag {{ wbparser_tag }} was requested with -e wbparser_tag.

- name: Keep the digest of the requested image
  ansible.builtin.set_fact:
    wbparser_digest: "{{ wbparser_resolved_digest }}"

# The browser runtime, resolved the same way through the same include: a tag
# is a name, and the browser the crawler drives must be the browser the
# deployment was checked against. Both images come from the same repository
# and are published under the same tag, so one tag resolves two digests.
- name: Resolve the browser runtime tag to a digest
  ansible.builtin.include_tasks: resolve-digest.yml
  vars:
    wbparser_resolve_ref: "{{ wbparser_browser_image_ref }}:{{ wbparser_browser_tag }}"
    wbparser_resolve_note: >-
      The browser runtime image is built from the same commit as the crawler
      and is published under the same tag, so the tag
      {{ wbparser_browser_tag }} names it.

- name: Keep the digest of the browser runtime image
  ansible.builtin.set_fact:
    wbparser_browser_digest: "{{ wbparser_resolved_digest }}"

# ── Remember what is running now ──────────────────────────────────────────────
# Read BEFORE .env is rewritten, because that file is what the rollback uses.

- name: Read the currently deployed digest
  ansible.builtin.slurp:
    src: "{{ wbparser_state_file }}"
  register: _wbparser_state
  changed_when: false
  failed_when: false

- name: Work out the previous digest
  ansible.builtin.set_fact:
    wbparser_previous_digest: >-
      {{ _wbparser_state.content | b64decode | trim
         if _wbparser_state.content is defined else '' }}

# The browser runtime has its own state, because it has its own previous
# version: a deploy can change the crawler, the browser, or both, and each
# rolls back to what was running before it.
- name: Read the currently deployed browser digest
  ansible.builtin.slurp:
    src: "{{ wbparser_browser_state_file }}"
  register: _wbparser_browser_state
  changed_when: false
  failed_when: false

- name: Work out the previous browser digest
  ansible.builtin.set_fact:
    wbparser_previous_browser_digest: >-
      {{ _wbparser_browser_state.content | b64decode | trim
         if _wbparser_browser_state.content is defined else '' }}

# The first deploy after the switch to digest deployment finds a state file
# from the old format: a TAG, which a moved tag makes ambiguous. It is
# resolved to a digest like any other tag, so the ability to roll back
# survives the switch instead of being lost with the file.
- name: Read the legacy tag left by the previous state format
  ansible.builtin.slurp:
    src: "{{ wbparser_legacy_state_file }}"
  register: _wbparser_legacy_state
  changed_when: false
  failed_when: false

- name: Work out the legacy tag
  ansible.builtin.set_fact:
    wbparser_legacy_tag: >-
      {{ _wbparser_legacy_state.content | b64decode | trim
         if _wbparser_legacy_state.content is defined else '' }}

- name: Resolve the legacy tag to a digest
  ansible.builtin.include_tasks: resolve-digest.yml
  vars:
    wbparser_resolve_ref: "{{ wbparser_image_ref }}:{{ wbparser_legacy_tag }}"
    wbparser_resolve_note: >-
      It is the rollback target: the tag left in
      {{ wbparser_legacy_state_file }} by the previous state format. Remove
      that file to deploy without a rollback target.
  when:
    - wbparser_previous_digest | length == 0
    - wbparser_legacy_tag | length > 0

- name: Keep the legacy tag's digest as the rollback target
  ansible.builtin.set_fact:
    wbparser_previous_digest: "{{ wbparser_resolved_digest }}"
  when:
    - wbparser_previous_digest | length == 0
    - wbparser_legacy_tag | length > 0

# ── Install the contract and its configuration ───────────────────────────────

- name: Ensure the deploy directory exists
  ansible.builtin.file:
    path: "{{ wbparser_base }}"
    state: directory
    owner: "{{ wbparser_owner }}"
    group: "{{ wbparser_group }}"
    mode: "0755"

- name: Install the compose file
  ansible.builtin.copy:
    src: "{{ wbparser_compose_src }}"
    dest: "{{ wbparser_compose_file }}"
    owner: "{{ wbparser_owner }}"
    group: "{{ wbparser_group }}"
    mode: "0644"

# The digest written into .env is a variable of its own so the rollback can
# re-render the same template with the previous value.
- name: Render the image digest file
  ansible.builtin.template:
    src: wbparser.env.j2
    dest: "{{ wbparser_env_file }}"
    owner: "{{ wbparser_owner }}"
    group: "{{ wbparser_group }}"
    mode: "0644"
  vars:
    wbparser_env_digest: "{{ wbparser_digest }}"
    wbparser_env_browser_digest: "{{ wbparser_browser_digest }}"

# The AdsPower key. It goes into a file of its own because the browser service
# reads it through `env_file`, which passes values literally — a key with a `$`
# in it must not be expanded by the tooling that reads the file.
- name: Render the browser runtime environment file
  ansible.builtin.template:
    src: wbparser.browser.env.j2
    dest: "{{ wbparser_browser_env_file }}"
    owner: "{{ wbparser_owner }}"
    group: "{{ wbparser_group }}"
    mode: "0600"  # holds the AdsPower Local API key
  no_log: true

- name: Render the application environment file
  ansible.builtin.template:
    src: wbparser.app.env.j2
    dest: "{{ wbparser_app_env_file }}"
    owner: "{{ wbparser_owner }}"
    group: "{{ wbparser_group }}"
    mode: "0600"  # holds the database password and the admin credentials
  # The diff of this template is the file's content: the database password,
  # the admin password and the AdsPower key, in clear text, in the log.
  no_log: true

# ── Deploy, and put it back if it does not come up ───────────────────────────

- name: Pull the images and start the containers
  block:

    # One compose call starts both services. The compose file belongs to the
    # application repository and declares both of them; `pull: always` pulls
    # every image it names, so the crawler AND the browser runtime arrive by
    # digest in the same step.
    - name: Pull and start
      community.docker.docker_compose_v2:
        project_src: "{{ wbparser_base }}"
        files:
          - "{{ wbparser_compose_file | basename }}"
        # `present` is `docker compose up` — the collection has no `started`
        # state, and a container that is already running the right digest is
        # left alone.
        state: present
        pull: always
        wait: true
        wait_timeout: "{{ wbparser_health_timeout }}"
      register: _wbparser_up

    # `wait` above already honours the container healthcheck. This repeats the
    # check so a failure arrives as a sentence about health rather than as
    # compose's exit status.
    - name: Confirm the container reports healthy
      ansible.builtin.command:
        argv: [docker, inspect, "{{ wbparser_container_name }}"]
      register: _wbparser_inspect
      changed_when: false
      until: >-
        (((_wbparser_inspect.stdout | from_json | first).State.Health) or {})
        .get('Status', 'none') == 'healthy'
      retries: "{{ wbparser_health_retries }}"
      delay: "{{ wbparser_health_delay }}"

    # The browser runtime has to be RUNNING, not healthy: a crawler that comes
    # up healthy with no browser beside it is a crawler that fails every fetch
    # for a reason that has nothing to do with its own healthcheck. The
    # container shares the crawler's network namespace, so the AdsPower Local
    # API at 127.0.0.1:50325 and the Chrome CDP ports are reachable by the
    # crawler without anything being published on the host.
    - name: Confirm the browser runtime container is running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{.State.Running}}' }}"
          - "{{ wbparser_browser_container_name }}"
      register: _wbparser_browser_inspect
      changed_when: false
      until: _wbparser_browser_inspect.stdout | trim == 'true'
      retries: "{{ wbparser_browser_health_retries }}"
      delay: "{{ wbparser_browser_health_delay }}"

    - name: Record the digest that is now running
      ansible.builtin.copy:
        content: "{{ wbparser_digest }}\n"
        dest: "{{ wbparser_state_file }}"
        owner: "{{ wbparser_owner }}"
        group: "{{ wbparser_group }}"
        mode: "0644"

    - name: Record the browser runtime digest that is now running
      ansible.builtin.copy:
        content: "{{ wbparser_browser_digest }}\n"
        dest: "{{ wbparser_browser_state_file }}"
        owner: "{{ wbparser_owner }}"
        group: "{{ wbparser_group }}"
        mode: "0644"

    # The legacy tag file has been folded into the digest file. Leaving it
    # behind would leave a tag that no longer describes the running image, and
    # a tag is exactly the thing that can be moved under you.
    - name: Remove the legacy tag file
      ansible.builtin.file:
        path: "{{ wbparser_legacy_state_file }}"
        state: absent
      when: wbparser_legacy_tag | default('') | length > 0

  rescue:

    # `docker logs` splits the container's own stdout and stderr across the
    # command's stdout and stderr, so a capture that reads only one of them
    # throws away half of what the application said.
    - name: Collect the last log lines from the failed container
      ansible.builtin.command:
        argv: [docker, logs, --tail, "40", "{{ wbparser_container_name }}"]
      register: _wbparser_failed_logs
      changed_when: false
      failed_when: false

    # The browser runtime's own last words, when there is one. A crawler that
    # came up healthy and a browser that did not start is a different failure
    # from a crawler that never came up, and the browser's log says which.
    - name: Collect the last log lines from the failed browser runtime
      ansible.builtin.command:
        argv: [docker, logs, --tail, "40", "{{ wbparser_browser_container_name }}"]
      register: _wbparser_browser_failed_logs
      changed_when: false
      failed_when: false

    # Nothing to go back to on a first deploy. Reported before the rollback
    # steps, which would otherwise re-render an empty digest and start nothing.
    - name: Report that there is nothing to roll back to
      ansible.builtin.fail:
        msg: >-
          {{ wbparser_image_ref }}@{{ wbparser_digest }} (the image named by the
          tag {{ wbparser_tag }}) did not come up within
          {{ wbparser_health_timeout }}s, and this is the first deploy on this
          host — there is no previous image to restore. The failed container is
          left in place for inspection.
          {{ '\n\nContainer logs:\n' }}
          {{ (_wbparser_failed_logs.stdout | default('')) }}
          {{ (_wbparser_failed_logs.stderr | default('')) }}
          {{ '\n\nBrowser runtime logs:\n' }}
          {{ (_wbparser_browser_failed_logs.stdout | default('')) }}
          {{ (_wbparser_browser_failed_logs.stderr | default('')) }}
      when: wbparser_previous_digest | length == 0

    # The browser runtime rolls back to its own previous digest. When there is
    # none — the first deploy that adds the browser to a host that already ran
    # the crawler — there is nothing to go back to, and the browser stays on
    # the image this deploy pulled: the crawler that comes back is an older
    # one that does not use it.
    - name: Work out the digests to roll back to
      ansible.builtin.set_fact:
        wbparser_rollback_digest: "{{ wbparser_previous_digest }}"
        wbparser_rollback_browser_digest: >-
          {{ (wbparser_previous_browser_digest | length > 0)
             | ternary(wbparser_previous_browser_digest, wbparser_browser_digest) }}

    - name: Re-render the image digest file with the previous digests
      ansible.builtin.template:
        src: wbparser.env.j2
        dest: "{{ wbparser_env_file }}"
        owner: "{{ wbparser_owner }}"
        group: "{{ wbparser_group }}"
        mode: "0644"
      vars:
        wbparser_env_digest: "{{ wbparser_rollback_digest }}"
        wbparser_env_browser_digest: "{{ wbparser_rollback_browser_digest }}"

    # After the .env above, never before: compose reads the digest out of that
    # file, so starting the container first would re-run the image that just
    # failed.
    - name: Restore the previous digests
      community.docker.docker_compose_v2:
        project_src: "{{ wbparser_base }}"
        files:
          - "{{ wbparser_compose_file | basename }}"
        state: present
        pull: always
        wait: true
        wait_timeout: "{{ wbparser_health_timeout }}"
      vars:
        wbparser_env_digest: "{{ wbparser_rollback_digest }}"
        wbparser_env_browser_digest: "{{ wbparser_rollback_browser_digest }}"

    - name: Fail with what happened and what was done about it
      ansible.builtin.fail:
        msg: >-
          {{ wbparser_image_ref }}@{{ wbparser_digest }} (the image named by the
          tag {{ wbparser_tag }}) did not come up within
          {{ wbparser_health_timeout }}s. Rolled back to
          {{ wbparser_image_ref }}@{{ wbparser_rollback_digest }}, which is what
          is running now.
          {% if wbparser_previous_browser_digest | length > 0 %}
          The browser runtime was rolled back too, to
          {{ wbparser_browser_image_ref }}@{{ wbparser_rollback_browser_digest }}.
          {% else %}
          The browser runtime stays on
          {{ wbparser_browser_image_ref }}@{{ wbparser_browser_digest }}: there was
          no browser runtime running before this deploy, so there is nothing to
          roll it back to.
          {% endif %}
          {{ '\n\nContainer logs:\n' }}
          {{ (_wbparser_failed_logs.stdout | default('')) }}
          {{ (_wbparser_failed_logs.stderr | default('')) }}
          {{ '\n\nBrowser runtime logs:\n' }}
          {{ (_wbparser_browser_failed_logs.stdout | default('')) }}
          {{ (_wbparser_browser_failed_logs.stderr | default('')) }}

# ── Report ────────────────────────────────────────────────────────────────────

- name: Report what is deployed
  ansible.builtin.debug:
    msg:
      - "Requested tag: {{ wbparser_tag }}"
      - "Running image: {{ wbparser_image_ref }}@{{ wbparser_digest }}"
      - "Digest: {{ wbparser_digest }}"
      - "Browser runtime: {{ wbparser_browser_image_ref }}@{{ wbparser_browser_digest }}"
      - "Browser service: {{ wbparser_browser_service_name }} ({{ wbparser_browser_container_name }})"
      - "Database: {{ wbparser_db_host }}:{{ wbparser_db_port }}/{{ wbparser_db_name }}"
      - "Profile: {{ wbparser_profile }}"
      - "Flyway: {{ wbparser_flyway_enabled }}"
      - "Caddy route: {{ wbparser_hostname }} → {{ wbparser_upstream }}"
      - "Rollback target: {{ wbparser_image_ref }}@{{ wbparser_previous_digest | default(wbparser_digest) }}"
      - >-
        Browser rollback target:
        {{ wbparser_browser_image_ref }}@{{ (wbparser_previous_browser_digest | length > 0)
        | ternary(wbparser_previous_browser_digest, wbparser_browser_digest) }}
