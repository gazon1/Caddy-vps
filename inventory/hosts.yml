---
# Inventory for the production VPS.
#
# BEFORE THE FIRST RUN fill in ansible_host (and ansible_user / become as needed).
# Every value can also be passed on the command line:
#
#   just bootstrap                      # uses whatever is written here
#   ansible-playbook site.yml -e caddy_base=/srv/caddy
#
# For a local throwaway run against Docker use the built-in lab inventory:
#
#   just lab-test                       # see tests/lab.sh

all:
  children:
    vps:
      hosts:
        vps-1:
          ansible_host: 91.188.212.39
          ansible_user: user
          # ansible_become: true
          # ansible_become_method: sudo
          # ansible_python_interpreter: /usr/bin/python3
    # The SOCKS5 endpoints: one host = one egress address = one egress group of
    # the crawler. The crawler is NOT multiplied — the addresses are (see the
    # application repository's ADR 2026-11-01-one-crawler-many-addresses).
    #
    # `socks5_client_cidrs` is the CRAWLER's address: the endpoint serves
    # nobody else, and it says so itself rather than leaving it to a firewall
    # rule that might fail open.
    #
    # The shape of a host:
    #
    #   egress-1:
    #     ansible_host: 198.51.100.10
    #     ansible_user: root
    #     socks5_client_cidrs:
    #       - "203.0.113.10/32"
    egress:
      hosts: {}
