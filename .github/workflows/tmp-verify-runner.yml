---
# ВРЕМЕННЫЙ файл: проверка раннерной части на настоящем ubuntu-latest.
# Workflow_dispatch нельзя запустить, пока файл не лежит в main, а main —
# решение владельца. Этот файл повторяет шаги deploy-wbparser.yml и доказывает,
# что они работают на раннере. После проверки файл будет удалён.
name: tmp-verify-runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Забрать репозиторий краулера
        uses: actions/checkout@v7
        with:
          repository: gazon1/wb-parser-kotlin-new
          ref: main
          path: crawler

      - name: Проверить, что файл compose на месте
        env:
          CRAWLER_REF: main
        run: |
          set -euo pipefail
          compose="$GITHUB_WORKSPACE/crawler/deploy/docker-compose.vps.yml"
          if [ ! -f "$compose" ]; then
            echo "::error::В рефе $CRAWLER_REF нет deploy/docker-compose.vps.yml — выкатывать нечего."
            exit 1
          fi
          echo "compose: $compose"

      - name: Поставить Ansible и коллекции
        run: |
          set -euo pipefail
          if command -v pipx >/dev/null 2>&1; then
            pipx install ansible-core
            pipx inject ansible-core requests
          else
            python3 -m pip install --user --break-system-packages ansible-core requests
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook --version
          ansible-galaxy collection list | head -5

      - name: Проверить, что SSH-секреты на месте
        id: ssh_check
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Нет секретов репозитория: ${missing[*]}."
            echo "::error::Создать: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Проверить, что секреты приложения на месте
        id: app_check
        continue-on-error: true
        env:
          WBPARSER_DB_PASSWORD: ${{ secrets.WBPARSER_DB_PASSWORD }}
          WBPARSER_ADMIN_PASSWORD: ${{ secrets.WBPARSER_ADMIN_PASSWORD }}
          WBPARSER_ADMIN_API_KEY: ${{ secrets.WBPARSER_ADMIN_API_KEY }}
          WBPARSER_CATALOG_API_KEY: ${{ secrets.WBPARSER_CATALOG_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in WBPARSER_DB_PASSWORD WBPARSER_ADMIN_PASSWORD \
                      WBPARSER_ADMIN_API_KEY WBPARSER_CATALOG_API_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Нет секретов репозитория: ${missing[*]}."
            exit 1
          fi

      # Секретов в репозитории нет, поэтому шаги выше обязаны упасть с
      # понятным сообщением, а не пройти молча. Здесь ожидаемый провал
      # превращается в успех шага: важно, что сообщение есть и называет
      # отсутствующие секреты поимённо.
      - name: Убедиться, что провал был понятным
        env:
          SSH_OUTCOME: ${{ steps.ssh_check.outcome }}
          APP_OUTCOME: ${{ steps.app_check.outcome }}
        run: |
          set -euo pipefail
          echo "ssh secrets: $SSH_OUTCOME, app secrets: $APP_OUTCOME"
          if [ "$SSH_OUTCOME" != "failure" ] || [ "$APP_OUTCOME" != "failure" ]; then
            echo "::error::Проверка секретов должна была упасть: секретов в репозитории нет."
            exit 1
          fi
          echo "Проверка секретов упала так, как и задумано, и назвала отсутствующие секреты."

      - name: Собрать инвентарь
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '---' \
            'all:' \
            '  children:' \
            '    vps:' \
            '      hosts:' \
            '        vps-1:' \
            "          ansible_host: ${VPS_HOST:-91.188.212.39}" \
            "          ansible_user: ${VPS_USER:-user}" \
            "          ansible_port: ${VPS_PORT:-22}" \
            '          ansible_become: true' \
            '          ansible_become_method: sudo' \
            > "$RUNNER_TEMP/inventory.yml"
          ansible-inventory -i "$RUNNER_TEMP/inventory.yml" --list --yaml

      - name: Syntax check
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ansible-playbook --syntax-check playbooks/wbparser.yml playbooks/status.yml

      # Тот самый read-only осмотр — против одноразового Caddy в Docker,
      # потому что до VPS отсюда не дотянуться, а проверить надо путь.
      - name: Осмотр через status.yml (одноразовый прокси)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/verify/conf.d
          printf '{\n\tauto_https off\n}\n:8080 {\n\trespond "ok"\n}\n' > /tmp/verify/Caddyfile
          docker run -d --name caddy_verify_lab -p 18080:8080 \
            -v /tmp/verify/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:2.11.7-alpine
          sleep 3
          ansible-playbook playbooks/status.yml \
            -i inventory/lab.yml \
            -e caddy_base=/tmp/verify \
            -e caddy_container=caddy_verify_lab \
            -e caddy_network=caddy_verify_net \
            --skip-tags caddy_infra,caddy_routes
