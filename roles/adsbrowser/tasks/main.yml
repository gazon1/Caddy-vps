---
# ==============================================================================
# Install and verify the adsbrowser CLI on the VPS.
#
# What this role does:
#   1. Verifies the pre-packaged tarball integrity (sha256)
#   2. Installs Xvfb + supporting X11 libs (headless virtual display)
#   3. Installs Node.js + npm from the system apt (no outbound network needed)
#   4. Installs the adspower-browser npm package from a pre-packaged tarball
#      (the VPS has no outbound network, so npm install from registry is impossible)
#   5. Registers Xvfb as a systemd service (enabled, not just started via shell)
#   6. Reports whether the foreign 'adspower' container is running (not a gate)
#   7. Checks connectivity to the AdsPower Local API
#   8. Verifies a headless browser launch (optional — requires a test profile ID)
#
# Prerequisites:
#   - The AdsPower Local API must already be running at
#     adsbrowser_endpoint (default http://localhost:50325).
#     The browser runtime image (wb-parser-browser) serves it inside the
#     crawler's network namespace; the adsbrowser_api role serves a native one
#     on the host. Either way, the check below is what decides.
#   - adsbrowser_api_key must be provided via -e or resolved from WBPARSER_ADMIN_API_KEY.
#
# Usage (standalone):
#   just adsbrowser-deploy -e adsbrowser_api_key=<key>
#
# Usage (combined with wbparser — already wired in wbparser.yml):
#   just wbparser-deploy -e wbparser_tag=<sha> -e adsbrowser_api_key=<key>
#
# NOTE: To update the package:
#   1. npm pack adspower-browser@<newver> --pack-destination /tmp/
#   2. sha256sum /tmp/adspower-browser-<newver>.tgz
#   3. cp /tmp/adspower-browser-<newver>.tgz roles/adsbrowser/files/
#   4. Update adsbrowser_cli_version and adsbrowseradsbrowser_tarball_sha256 in defaults/main.yml
# ==============================================================================

- name: Gather facts
  ansible.builtin.setup:
  when: ansible_facts == {}

# ── Validate required inputs ───────────────────────────────────────────────────
# Fix #2: Support WBPARSER_ADMIN_API_KEY from env as fallback when adsbrowser_api_key is empty.
# Ansible precedence: -e var > role default. So if user passed -e adsbrowser_api_key=...,
# it overrides this resolution; otherwise we try WBPARSER_ADMIN_API_KEY.

- name: Resolve adsbrowser_api_key (fall back to WBPARSER_ADMIN_API_KEY env var)
  ansible.builtin.set_fact:
    adsbrowser_api_key: >-
      {{ adsbrowser_api_key
         | default(lookup('env', 'WBPARSER_ADMIN_API_KEY') | default('', true), true) }}
  when: not (adsbrowser_api_key | default('') | length > 0)

- name: Fail if adsbrowser_api_key is not provided
  ansible.builtin.assert:
    that:
      - adsbrowser_api_key | length > 0
    fail_msg: >-
      adsbrowser_api_key is not set. Provide it via -e or set WBPARSER_ADMIN_API_KEY in the environment:
        just wbparser-deploy -e wbparser_tag=<sha> -e adsbrowser_api_key=<key>
        WBPARSER_ADMIN_API_KEY=<key> just adsbrowser-deploy

# ── OS-level dependencies ───────────────────────────────────────────────────────

- name: Install Xvfb and X11 libraries for headless display
  ansible.builtin.apt:
    pkg:
      - xvfb
      - x11vnc
      - fluxbox
      - dbus-x11
      - libnss3
      - libgbm1
      - libasound2t64
      - libatk-bridge2.0-0
      - libgtk-3-0
      - libx11-xcb1
      - libxcomposite1
      - libxcursor1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libxrender1
      - libxss1
      - libxtst6
      - fonts-liberation
      - fonts-noto-cjk
    state: present
    update_cache: true
  become: true

- name: Install Node.js and npm from system apt
  ansible.builtin.apt:
    pkg:
      - nodejs
    state: present
    update_cache: true
  become: true

# ── Install adspower-browser CLI (offline — VPS has no outbound network) ───────

- name: Check if adspower-browser is already installed and matches expected version
  ansible.builtin.command:
    argv: [ads, --version]
  register: _adsbrowser_already_installed
  changed_when: false
  failed_when: false
  # В check mode команда не выполняется — результата нет, и читать нечего.
  # Проба отвечает на вопрос «стоит ли ставить CLI», и в dry run этот вопрос
  # не задаётся: блок установки ниже тоже пропускается.
  when: not ansible_check_mode

- name: Install adspower-browser from local tarball
  when:
    # В check mode блок пропускается: команда-проба не выполнялась, ответа у
    # неё нет, и «установлено или нет» неизвестно. Показывать установку, о
    # которой неизвестно, нужно ли, было бы враньём в diff.
    - not ansible_check_mode
    - (_adsbrowser_already_installed.rc | default(1)) != 0
  block:
    - name: Verify tarball is present on control node
      ansible.builtin.stat:
        path: "{{ role_path }}/files/adspower-browser-{{ adsbrowser_cli_version }}.tgz"
      register: adsbrowser_tarball_stat

    - name: Fail if tarball is missing
      ansible.builtin.fail:
        msg: >-
          Tarball {{ role_path }}/files/adspower-browser-{{ adsbrowser_cli_version }}.tgz
          not found. To update the package:
            npm pack adspower-browser@{{ adsbrowser_cli_version }} --pack-destination /tmp/
            cp /tmp/adspower-browser-{{ adsbrowser_cli_version }}.tgz roles/adsbrowser/files/
          Then update adsbrowser_cli_version and adsbrowseradsbrowser_tarball_sha256 in defaults/main.yml
      when: not (adsbrowser_tarball_stat.stat.exists | default(false) | bool)

    - name: Copy tarball to VPS
      ansible.builtin.copy:
        src: "{{ role_path }}/files/adspower-browser-{{ adsbrowser_cli_version }}.tgz"
        dest: /tmp/adspower-browser-{{ adsbrowser_cli_version }}.tgz
        mode: "0644"

    # Fix #1: Verify sha256 of the copied tarball before installing
    - name: Verify tarball integrity (sha256)
      ansible.builtin.command:
        argv: [sha256sum, "/tmp/adspower-browser-{{ adsbrowser_cli_version }}.tgz"]
      register: adsbrowser_tarball_sha256
      changed_when: false
      # В check mode файл на хосте не появился (copy в dry run только
      # показывает diff), хешировать нечего, а команда в check mode и не
      # выполняется. Проверка целостности — это проверка, и в dry run её
      # пропускать нельзя молча: она пропускается явно.
      when: not ansible_check_mode

    - name: Fail when tarball sha256 does not match expected value
      ansible.builtin.fail:
        msg: >-
          Tarball sha256 mismatch.
          Expected: {{ adsbrowseradsbrowser_tarball_sha256 }}
          Got:      {{ (adsbrowser_tarball_sha256.stdout | default('')) | trim | split | last }}
          The tarball on the control node is corrupted or has been replaced without
          updating adsbrowseradsbrowser_tarball_sha256 in defaults/main.yml.
      when:
        - not ansible_check_mode
        - ((adsbrowser_tarball_sha256.stdout | default('')) | trim | split | last)
          != adsbrowseradsbrowser_tarball_sha256

    - name: Install adspower-browser from tarball
      ansible.builtin.command:
        argv: [npm, install, -g, "/tmp/adspower-browser-{{ adsbrowser_cli_version }}.tgz"]
      become: true
      register: _adsbrowser_cli_installed
      changed_when: true

    - name: Clean up tarball
      ansible.builtin.file:
        path: /tmp/adspower-browser-{{ adsbrowser_cli_version }}.tgz
        state: absent

- name: Check adspower-browser version
  ansible.builtin.command:
    argv: [ads, --version]
  register: _adsbrowser_version_check
  changed_when: false
  failed_when: false
  # В check mode команда не выполняется — версии у нас нет.
  when: not ansible_check_mode

- name: Report adspower-browser version
  ansible.builtin.debug:
    msg: "adspower-browser {{ _adsbrowser_version_check.stdout | default('unknown') | trim }}"
  # В check mode версия не проверялась, поэтому и показывать её не из чего:
  # пустая строка выглядела бы как «версия неизвестна», а это неправда.
  when: not ansible_check_mode

# ── Environment configuration ──────────────────────────────────────────────────

- name: Ensure adsbrowser directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ adsbrowser_owner }}"
    group: "{{ adsbrowser_group }}"
    mode: "0755"
  loop:
    - "{{ adsbrowser_config_dir }}"
    - "{{ adsbrowser_log_dir }}"

- name: Install adsbrowser environment file
  ansible.builtin.template:
    src: adsbrowser.env.j2
    dest: "{{ adsbrowser_config_dir }}/adsbrowser.env"
    owner: "{{ adsbrowser_owner }}"
    group: "{{ adsbrowser_group }}"
    mode: "0600"

- name: Symlink the environment file for shell sessions
  ansible.builtin.lineinfile:
    path: "{{ adsbrowser_shell_rc }}"
    regexp: "^.*ADSPOWER_ENDPOINT=.*"
    line: "source {{ adsbrowser_config_dir }}/adsbrowser.env"
    state: present
    create: true
    mode: "0644"
  become: true

# ── Xvfb as a proper systemd service (fixes #3, #4, #10) ───────────────────────

- name: Deploy Xvfb systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/xvfb.service
    content: |
      [Unit]
      Description=X Virtual Framebuffer (headless X11)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      ExecStartPre=/bin/rm -f /tmp/.X99-lock /tmp/.X11-unix/X99
      # Start Xvfb, redirect stdout/stderr to the role's log dir
      ExecStart=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
      ExecStartPost=/bin/sleep 2
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Ensure Xvfb is enabled and started via systemd
  ansible.builtin.systemd:
    name: xvfb
    enabled: true
    state: started
    daemon_reload: true
  become: true
  # В check mode systemd ничего не запускает, а юнит-файла на хосте ещё нет
  # (copy в dry run только показывает diff) — модуль упал бы с «юнит не
  # найден». Пропускаем явно: сухой прогон не включает и не запускает сервисы.
  when: not ansible_check_mode

# Fix #7: Deploy logrotate configuration for xvfb and adsbrowser logs
- name: Deploy logrotate config for adsbrowser logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/adsbrowser
    content: |
      {{ adsbrowser_log_dir }}/*.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 root root
      }
    mode: "0644"
  become: true

# ── The foreign adspower container (a report, not a gate) ─────────────────────
# This container belongs to ANOTHER project on this host. It used to be the way
# the AdsPower Local API was reached, and this check used to fail the deploy
# when it was not running. It is not running any more, and it is not the
# deploy's business: the browser runtime now ships as an image
# (wb-parser-browser) and is started by the wbparser role, with the Local API
# on 127.0.0.1:50325 inside the crawler's network namespace.
#
# So this only says what it sees. The check that actually matters is the one
# below: the AdsPower Local API must answer.

- name: Check if the foreign adspower container is running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{.State.Status}}' }}"
      - adspower
  register: adsbrowser_container_check
  changed_when: false
  failed_when: false
  # В check mode команда не выполняется — состояния чужого контейнера мы не
  # знаем, и врать про него нельзя.
  when: not ansible_check_mode

- name: Report that the foreign adspower container is not there
  ansible.builtin.debug:
    msg: >-
      The 'adspower' container (another project's, not this deployment's) is
      not running here. Nothing to do about it: the AdsPower runtime this
      deployment uses is the wb-parser-browser image, and the Local API is
      checked below.
  when:
    - not ansible_check_mode
    - (adsbrowser_container_check.rc | default(1)) != 0
      or (adsbrowser_container_check.stdout | default('')) | trim != 'running'

# ── AdsPower Local API connectivity check (fix #5 — hard failure) ────────────────

- name: Check if AdsPower Local API is reachable
  ansible.builtin.command:
    argv: [ads, check-status, -k, "{{ adsbrowser_api_key }}", -p, "{{ adsbrowser_api_port }}"]
  register: _adsbrowser_api_check
  changed_when: false
  # FIX #5: Removed failed_when: false — a non-zero exit IS a failure
  # В check mode команда не выполняется — ответа Local API нет, и читать
  # нечего. Проба описывает состояние хоста прямо сейчас, а выкат может это
  # состояние как раз и починить, поэтому сухой прогон на нём не падает.
  when: not ansible_check_mode

- name: Report AdsPower Local API status
  ansible.builtin.debug:
    msg: "AdsPower Local API: {{ _adsbrowser_api_check.stdout | default(_adsbrowser_api_check.stderr) | trim }}"
  when:
    - not ansible_check_mode
    - (_adsbrowser_api_check.rc | default(1)) == 0

- name: Fail when AdsPower Local API is not reachable
  ansible.builtin.fail:
    msg: >-
      AdsPower Local API is not reachable at {{ adsbrowser_endpoint }}:{{ adsbrowser_api_port }}.
      Exit code: {{ (_adsbrowser_api_check.rc | default(1)) }}
      Output: {{ (_adsbrowser_api_check.stdout | default('')) | trim }}
      Stderr: {{ (_adsbrowser_api_check.stderr | default('')) | trim }}

      The AdsPower runtime that serves this API is the wb-parser-browser
      image, deployed by the wbparser role. Deploy it, and check that the
      service is up:
        docker ps --filter name=wb-parser-browser
  when:
    - not ansible_check_mode
    - (_adsbrowser_api_check.rc | default(1)) != 0

# ── Headless browser launch verification ──────────────────────────────────────
# Fix #10: Replaced shell/command guessing with proper deterministic checks.

- name: Check if test profile is configured
  ansible.builtin.set_fact:
    _adsbrowser_has_test_profile: "{{ adsbrowser_test_profile_id | length > 0 }}"

- name: Launch browser in headless mode for verification
  when:
    # Сухой прогон не должен поднимать браузер. Это единственная проба в
    # репозитории, которая запускает настоящий браузер, и обещание «ничего
    # не выполняется» должно быть правдой: headless-запуск в check mode не
    # выполняется, результата нет, и читать нечего.
    - not ansible_check_mode
    - _adsbrowser_has_test_profile | bool
  block:

    - name: Open browser profile in headless mode
      ansible.builtin.command:
        argv:
          - ads
          - open-browser
          - "{{ adsbrowser_test_profile_id }}"
          - -k
          - "{{ adsbrowser_api_key }}"
          - -p
          - "{{ adsbrowser_api_port }}"
          - --headless
          - "1"
      register: _adsbrowser_headless_open
      changed_when: true
      timeout: 60

    - name: Poll until browser appears as open (up to 30s)
      ansible.builtin.command:
        argv:
          - ads
          - get-opened-browser
          - -k
          - "{{ adsbrowser_api_key }}"
          - -p
          - "{{ adsbrowser_api_port }}"
      register: _adsbrowser_opened_check
      changed_when: false
      until: (_adsbrowser_opened_check.stdout | default('')) | regex_search(adsbrowser_test_profile_id) | length > 0
      retries: 10
      delay: 3
      when: (_adsbrowser_headless_open.rc | default(1)) == 0

    - name: Close the verification browser
      ansible.builtin.command:
        argv:
          - ads
          - close-browser
          - "{{ adsbrowser_test_profile_id }}"
          - -k
          - "{{ adsbrowser_api_key }}"
          - -p
          - "{{ adsbrowser_api_port }}"
      changed_when: true
      when: _adsbrowser_has_test_profile | bool

    - name: Assert headless browser was opened successfully
      ansible.builtin.assert:
        that:
          - "(_adsbrowser_headless_open.rc | default(1)) == 0"
        fail_msg: >-
          Headless browser launch failed (exit {{ (_adsbrowser_headless_open.rc | default(1)) }}).
          stdout: {{ (_adsbrowser_headless_open.stdout | default('')) | trim }}
          stderr: {{ (_adsbrowser_headless_open.stderr | default('')) | trim }}
      when: _adsbrowser_has_test_profile | bool

- name: Warn when no test profile is configured
  ansible.builtin.debug:
    msg: >-
      adsbrowser_test_profile_id is not set — skipping headless launch verification.
      To verify headless operation end-to-end:
        just adsbrowser-deploy -e adsbrowser_api_key=<key> -e adsbrowser_test_profile_id=kxpu63n
  when:
    - not ansible_check_mode
    - not (_adsbrowser_has_test_profile | default(false) | bool)

# ── Final report ───────────────────────────────────────────────────────────────

- name: Report adsbrowser setup status
  ansible.builtin.debug:
    msg:
      - >-
        adspower-browser CLI :
        {{ 'not checked (dry run)' if ansible_check_mode
           else _adsbrowser_version_check.stdout | default('unknown') | trim }}
      # В check mode systemd ничего не включал и не запускал — показывать
      # «enabled + started» было бы враньём.
      - >-
        Xvfb systemd service :
        {{ 'would be enabled + started (display :99)' if ansible_check_mode
           else 'enabled + started (display :99)' }}
      - "DISPLAY               : :99"
      - "AdsPower API          : {{ adsbrowser_endpoint }}:{{ adsbrowser_api_port }}"
      # В check mode ни CLI, ни Local API не проверялись и браузер не
      # поднимался: показывать «passed» было бы враньём.
      - >-
        Headless verification :
        {{ 'not checked (dry run — nothing was started)'
           if ansible_check_mode
           else ('passed' if _adsbrowser_has_test_profile | default(false) | bool
                 else 'skipped (no test profile)') }}
