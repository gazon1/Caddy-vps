# ==============================================================================
# Deploy wbshop (product-catalog) with parser + migrations.
#
# This playbook deploys in order:
#   1. adsbrowser  — headless browser (if needed by parser)
#   2. wbparser    — parser container, with rollback on failure
#   3. Flyway      — baseline + migrate on shared DB (once, when needed)
#   4. wbshop      — product-catalog container
#   5. Caddy route — publish the route
#
# Usage:
#   just wbshop-deploy           # deploy current HEAD (from app repo)
#   ansible-playbook playbooks/wbshop.yml -e "wbparser_tag=<sha>" -e "wbshop_tag=<sha>"
#
# Required environment / variables:
#   wbparser_tag             — Docker image tag for parser
#   wbshop_tag               — Docker image tag for wbshop
#   WBPARSER_COMPOSE_SRC    — path to parser's deploy/docker-compose.vps.yml
#   WBSHOP_COMPOSE_SRC      — path to wbshop's docker-compose.yml (optional, uses app.env)
#   WBPARSER_DB_PASSWORD    — database password
#   WBPARSER_ADMIN_PASSWORD — admin password
#   WBPARSER_ADMIN_API_KEY  — admin API key (used for adsbrowser when adspower_enabled=true)
#
# Optional variables:
#   adspower_enabled         — set false to skip adsbrowser (default: true)
#
# The Caddy-vps directory convention: roles own the logic, playbooks wire them.
# ==============================================================================

- name: Deploy adsbrowser headless browser
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  # Set adspower_enabled=false to skip if the parser does not use AdsPower automation.
  # Requires adsbrowser_api_key (or WBPARSER_ADMIN_API_KEY) when enabled.
  when: adspower_enabled | default(true) | bool

  vars:
    adsbrowser_api_key: "{{ lookup('env', 'WBPARSER_ADMIN_API_KEY') | default('', true) }}"

  roles:
    - role: adsbrowser
      tags: [adsbrowser]

- name: Deploy wb-parser crawler
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"

  vars:
    wbparser_compose_src: >-
      {{ lookup('env', 'WBPARSER_COMPOSE_SRC') | default('', true) }}
    caddy_route_name: "{{ wbparser_route_name }}"
    caddy_route_url: "{{ wbparser_route_url }}"

  roles:
    - role: wbparser
      tags: [wbparser]

  tasks:
    - name: Render the wb-parser route snippet
      ansible.builtin.set_fact:
        caddy_route_content: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../roles/wbparser/templates/Caddyfile.snippet.j2') }}
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Apply the route
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/routes.yml"
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Remove the route
      ansible.builtin.file:
        path: "{{ caddy_conf_d }}/{{ wbparser_route_name }}.caddy"
        state: absent
      notify: Reload Caddy
      when: wbparser_hostname | length == 0
      tags: [caddy_routes]

  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ caddy_container }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
      changed_when: true

- name: Run Flyway migrations on the shared database
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [flyway]

  vars:
    # Database on the shared DB host
    flyway_db_host: "{{ wbparser_db_host }}"
    flyway_db_port: "{{ wbparser_db_port }}"
    flyway_db_name: "{{ wbparser_db_name }}"
    flyway_db_user: "{{ wbparser_db_user }}"
    flyway_db_password: "{{ lookup('env', 'WBPARSER_DB_PASSWORD') }}"
    flyway_container: "wb-parser"
    flyway_jar_path: "/app/app.jar"

  tasks:
    - name: Verify parser container is running
      ansible.builtin.command:
        argv: [docker, inspect, "{{ flyway_container }}"]
      register: _flyway_parser_inspect
      changed_when: false
      failed_when: _flyway_parser_inspect.rc != 0

    - name: Check if Flyway baseline is needed
      block:
        - name: Run Flyway info to check schema state
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - info
          register: _flyway_info
          changed_when: false
          failed_when: false

        - name: Parse Flyway info output
          ansible.builtin.set_fact:
            _flyway_schema_count: "{{ _flyway_info.stdout_lines | select('search', 'Schema [^ ]* table') | list | length }}"

        - name: Show current Flyway state
          ansible.builtin.debug:
            msg: "Flyway schema count: {{ _flyway_schema_count }}"
      rescue:
        - name: Report Flyway check failed
          ansible.builtin.debug:
            msg: "Flyway info failed — database may need baseline manually"

    - name: Run Flyway baseline (for non-empty legacy schema)
      when: _flyway_schema_count | default(0) | int == 0
      block:
        - name: Run Flyway baseline
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - baseline
              - -baselineVersion=1
              - -baselineDescription="Legacy NET schema baseline"
          register: _flyway_baseline
          changed_when: true

        - name: Show baseline result
          ansible.builtin.debug:
            msg: "{{ _flyway_baseline.stdout }}"

        - name: Run Flyway migrate after baseline
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - migrate
          register: _flyway_migrate
          changed_when: true

        - name: Show migrate result
          ansible.builtin.debug:
            msg: "{{ _flyway_migrate.stdout }}"

    - name: Run Flyway migrate (already baselined)
      when: _flyway_schema_count | default(0) | int > 0
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ flyway_container }}"
          - java
          - -cp
          - "{{ flyway_jar_path }}"
          - org.flywaydb.commandline.Main
          - migrate
      register: _flyway_migrate
      changed_when: true

    - name: Show Flyway result
      ansible.builtin.debug:
        msg: "{{ _flyway_migrate.stdout }}"

- name: Deploy wbshop (product-catalog)
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [wbshop]

  vars:
    # Image
    wbshop_registry: "ghcr.io"
    wbshop_image_owner: "gazon1"
    wbshop_image_name: "product-catalog"

    # Paths on VPS
    wbshop_base: "/opt/wbshop"
    wbshop_compose_file: "{{ wbshop_base }}/docker-compose.yml"
    wbshop_env_file: "{{ wbshop_base }}/.env"
    wbshop_state_file: "{{ wbshop_base }}/.deployed-tag"
    wbshop_app_env_file: "{{ wbshop_base }}/app.env"

    # Compose source (control machine)
    wbshop_compose_src: >-
      {{ lookup('env', 'WBSHOP_COMPOSE_SRC') | default('', true) }}

    # Container
    wbshop_container_name: "product-catalog"

    # Database (shared, read from crawler)
    # These match the wbparser role defaults since wbshop reads the same DB
    wbshop_db_host: "91.188.212.209"
    wbshop_db_port: "5432"
    wbshop_db_name: "wbparser"
    wbshop_db_user: "catalog"
    wbshop_db_password: "{{ lookup('env', 'WBPARSER_DB_PASSWORD') }}"

    # Health gate
    wbshop_health_timeout: 180
    wbshop_health_retries: 20
    wbshop_health_delay: 6

    # Site URL (for canonical URLs, sitemap, etc.)
    wbshop_site_url: "https://wb-parser.maxdrobin.ru"

    # Ownership
    wbshop_owner: root
    wbshop_group: root

    # Caddy route
    wbshop_route_name: "product-catalog"
    wbshop_hostname: "wb-parser.maxdrobin.ru"

  tasks:
    - name: Validate wbshop_tag is set
      ansible.builtin.assert:
        that:
          - wbshop_tag | length > 0
        fail_msg: >-
          wbshop_tag is empty. Pass the tag:
          ansible-playbook playbooks/wbshop.yml -e wbshop_tag=<sha>

    - name: Check that compose source exists
      ansible.builtin.set_fact:
        _wbshop_compose_readable: >-
          {{ lookup('ansible.builtin.file', wbshop_compose_src, errors='ignore')
             | length > 0 }}

    - name: Fail when compose source is missing
      ansible.builtin.fail:
        msg: >-
          wbshop_compose_src is not set or not readable.
          Set it with: -e wbshop_compose_src=/path/to/docker-compose.yml
      when: not (_wbshop_compose_readable | default(false) | bool)

    - name: Read currently deployed tag
      ansible.builtin.slurp:
        src: "{{ wbshop_state_file }}"
      register: _wbshop_state
      changed_when: false
      failed_when: false

    - name: Work out the previous tag
      ansible.builtin.set_fact:
        wbshop_previous_tag: >-
          {{ _wbshop_state.content | b64decode | trim
             if _wbshop_state.content is defined else '' }}

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ wbshop_base }}"
        state: directory
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0755"

    - name: Install the compose file
      ansible.builtin.copy:
        src: "{{ wbshop_compose_src }}"
        dest: "{{ wbshop_compose_file }}"
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0644"
      when: wbshop_compose_src | length > 0

    - name: Render .env with TAG and IMAGE_OWNER
      ansible.builtin.copy:
        dest: "{{ wbshop_env_file }}"
        content: |
          TAG={{ wbshop_tag }}
          IMAGE_OWNER={{ wbshop_image_owner }}
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0644"

    - name: Render app.env with DATABASE_URL
      ansible.builtin.copy:
        dest: "{{ wbshop_app_env_file }}"
        content: |
          DATABASE_URL=postgresql://{{ wbshop_db_user }}:{{ wbshop_db_password }}@{{ wbshop_db_host }}:{{ wbshop_db_port }}/{{ wbshop_db_name }}?sslmode=require
          NEXT_PUBLIC_SITE_URL={{ wbshop_site_url }}
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0600"
      no_log: true

    - name: Pull and start wbshop
      block:
        - name: Pull and start
          community.docker.docker_compose_v2:
            project_src: "{{ wbshop_base }}"
            files:
              - "{{ wbshop_compose_file | basename }}"
            state: present
            pull: always
            wait: true
            wait_timeout: "{{ wbshop_health_timeout }}"
          register: _wbshop_up

        - name: Confirm container reports healthy
          ansible.builtin.command:
            argv: [docker, inspect, "{{ wbshop_container_name }}"]
          register: _wbshop_inspect
          changed_when: false
          until: >-
            (((_wbshop_inspect.stdout | from_json | first).State.Health) or {})
            .get('Status', 'none') == 'healthy'
          retries: "{{ wbshop_health_retries }}"
          delay: "{{ wbshop_health_delay }}"

        - name: Record the tag that is now running
          ansible.builtin.copy:
            content: "{{ wbshop_tag }}\n"
            dest: "{{ wbshop_state_file }}"
            owner: "{{ wbshop_owner }}"
            group: "{{ wbshop_group }}"
            mode: "0644"

      rescue:
        - name: Collect logs from failed container
          ansible.builtin.command:
            argv: [docker, logs, --tail, "40", "{{ wbshop_container_name }}"]
          register: _wbshop_failed_logs
          changed_when: false
          failed_when: false

        - name: Fail when no previous tag to rollback to
          ansible.builtin.fail:
            msg: >-
              wbshop {{ wbshop_tag }} did not become healthy.
              This is the first deploy — nothing to roll back to.
              {{ '\n\nContainer logs:\n' }}
              {{ _wbshop_failed_logs.stdout }}
              {{ _wbshop_failed_logs.stderr }}
          when: wbshop_previous_tag | length == 0

        - name: Restore previous tag
          ansible.builtin.copy:
            dest: "{{ wbshop_env_file }}"
            content: |
              TAG={{ wbshop_previous_tag }}
              IMAGE_OWNER={{ wbshop_image_owner }}
            owner: "{{ wbshop_owner }}"
            group: "{{ wbshop_group }}"
            mode: "0644"

        - name: Restart with previous tag
          community.docker.docker_compose_v2:
            project_src: "{{ wbshop_base }}"
            files:
              - "{{ wbshop_compose_file | basename }}"
            state: present
            pull: always
            wait: true
            wait_timeout: "{{ wbshop_health_timeout }}"

        - name: Report rollback
          ansible.builtin.fail:
            msg: >-
              wbshop {{ wbshop_tag }} did not become healthy.
              Rolled back to {{ wbshop_previous_tag }}.
              {{ '\n\nContainer logs:\n' }}
              {{ _wbshop_failed_logs.stdout }}
              {{ _wbshop_failed_logs.stderr }}

    - name: Report what is deployed
      ansible.builtin.debug:
        msg:
          - "Image: {{ wbshop_registry }}/{{ wbshop_image_owner }}/{{ wbshop_image_name }}:{{ wbshop_tag }}"
          - "Database: {{ wbshop_db_host }}:{{ wbshop_db_port }}/{{ wbshop_db_name }}"
          - "Rollback target: {{ wbshop_previous_tag }}"

- name: Apply Caddy route for wbshop
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [caddy_routes]

  vars_files:
    - "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"

  vars:
    caddy_route_name: "{{ wbshop_route_name | default('product-catalog') }}"
    wbshop_hostname: "{{ wbshop_hostname | default('wb-parser.maxdrobin.ru') }}"

  tasks:
    - name: Render wbshop Caddy snippet
      ansible.builtin.set_fact:
        caddy_route_content: |
          {{ wbshop_hostname }} {
              encode gzip zstd

              reverse_proxy product-catalog:3000 {
                  header_up Host {host}
                  header_up X-Real-IP {remote_host}
                  flush_interval -1
              }

              header {
                  X-Content-Type-Options "nosniff"
                  Referrer-Policy "strict-origin-when-cross-origin"
                  X-Frame-Options "DENY"
                  Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
              }

              log {
                  output stdout
                  format console
              }
          }
      when: wbshop_hostname | length > 0

    - name: Apply the route
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/routes.yml"
      when: wbshop_hostname | length > 0

  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ caddy_container }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
      changed_when: true
