---
# Deploy the wb-parser crawler + adsbrowser headless browser on the VPS.
#
#   just deploy                          # in the app repo — builds, pushes, then runs this
#   just wbparser-deploy -e wbparser_tag=<sha>           # full stack
#   just wbparser-deploy -e wbparser_tag=<sha> --tags wbparser   # parser only, no route
#   just adsbrowser-deploy -e adsbrowser_api_key=<key>    # adsbrowser only
#
# Role order and rationale:
#
#   1. adsbrowser_api  starts the AdsPower Local API server (native systemd).
#                This must be running BEFORE adsbrowser verifies headless launch.
#                The API key is resolved from WBPARSER_ADMIN_API_KEY if not
#                passed explicitly with -e adsbrowser_api_key=...
#   2. adsbrowser  installs Xvfb, the adspower-browser CLI, starts the virtual
#                display, and verifies a headless browser launch.
#   3. wbparser   pulls the crawler image AND the browser runtime image, runs
#                both containers, health-gates them, and rolls back on failure.
#   4. caddy routes.yml  publishes the route. Registering a route to a container
#                that is not yet up would let Caddy forward into the void while
#                caddy validate passes — which is exactly what this gate prevents.
#
# The browser runtime image is deployed by the wbparser role, not here: the two
# images are built from the same commit and published under the same tag, and
# the role resolves that one tag to two digests and rolls both back together.
#
# Secrets come from the environment, never from -e on a command line that ends
# up in shell history and in the CI log:
#
#   WBPARSER_DB_PASSWORD       the database password
#   WBPARSER_ADMIN_PASSWORD    the admin API's password
#   WBPARSER_ADMIN_API_KEY     the admin API's X-Api-Key (optional)
#   WBPARSER_CATALOG_API_KEY   the catalog API's key — required, and a
#                              comma-separated list so a key can be rotated
#                              without a gap in service
#   WBPARSER_GHCR_USER         registry user for a private image (optional)
#   WBPARSER_GHCR_TOKEN        registry token for a private image (optional)

- name: Deploy adsbrowser API, headless browser and wb-parser crawler
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true

  # Load encrypted vault if ANSIBLE_VAULT_PASSWORD_FILE is configured.
  # Runs before roles so vault_adsbrowser_api_key is available in adsbrowser_api vars.
  pre_tasks:
    - name: Load vault secrets if configured
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/vps/vault.yml"
      # The vault file is optional: it may not exist on a machine that keeps
      # its secrets elsewhere. `failed_when` says that without hiding the task
      # from the report.
      failed_when: false
      tags: [always]

  vars_files:
    # Caddy role defaults (needed by routes.yml import, without running the role).
    - "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"

  vars:
    # Resolved at play level (priority order):
    #   1. explicit -e adsbrowser_api_key=<key>
    #   2. WBPARSER_ADMIN_API_KEY from environment
    #   3. vault_adsbrowser_api_key from inventory/group_vars/vps/vault.yml
    #
    # An extra var outranks a play var, so `-e adsbrowser_api_key=…` is used
    # as it is and this expression is only ever evaluated when it is absent.
    #
    # The comparison is parenthesised on purpose. In Jinja `a | length > 0 |
    # ternary(x, y)` parses as `(a|length) > (0|ternary(x, y))` — the filter
    # binds tighter than the comparison — so the condition ends up comparing
    # an int with a string and the whole play var raises a TypeError.
    adsbrowser_api_key: >-
      {{
        ((lookup('env', 'WBPARSER_ADMIN_API_KEY') | default('', true)) | length > 0)
        | ternary(lookup('env', 'WBPARSER_ADMIN_API_KEY'),
                  vault_adsbrowser_api_key | default('', true))
      }}

    # Where deploy/docker-compose.vps.yml lives on the control node. `just deploy`
    # passes this explicitly; the environment variable is the fallback for running
    # this playbook by hand.
    wbparser_compose_src: >-
      {{ lookup('env', 'WBPARSER_COMPOSE_SRC') | default('', true) }}

    caddy_route_name: "{{ wbparser_route_name }}"
    # Validated against the same regex routes.yml enforces, before the import.
    caddy_route_url: "{{ wbparser_route_url }}"

  roles:
    - role: adsbrowser_api
      tags: [adsbrowser-api]
    - role: adsbrowser
      tags: [adsbrowser]
    - role: wbparser
      tags: [wbparser]

  tasks:
    - name: Render the wb-parser route snippet
      ansible.builtin.set_fact:
        caddy_route_content: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../roles/wbparser/templates/Caddyfile.snippet.j2') }}
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Apply the route
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/routes.yml"
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    # The catalog answers only when the schema answers.
    #
    # The route is up and the container reports healthy, and neither of those
    # says anything about the catalog: the container's health check asks
    # /api/health/live, which does not touch the database at all, and the route
    # only proves that a request reaches the application.
    #
    # /api/catalog/v1/ready does touch it, through the catalog's own pool, and
    # answers 503 when the schema is not the one the projection expects. This
    # is the check that the deploy leaves behind: the storefront pins this
    # image by digest and reads this catalog, and a deploy that shipped a
    # catalog which cannot answer is a deploy the storefront cannot use.
    #
    # The key goes in a header, and the probe does not log: the command's
    # arguments carry the secret, and an argument list is exactly what a
    # verbose Ansible run prints. The answer is reported by the task below,
    # which has the status code and no secret.
    - name: Ask the catalog whether it can answer
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --max-time
          - "30"
          - --header
          - "X-Api-Key: {{ _wbparser_catalog_api_key }}"
          - "https://{{ wbparser_hostname }}/api/catalog/v1/ready"
      register: _wbparser_catalog_probe
      changed_when: false
      # The failure is reported by the task below, which can say what the
      # catalog answered. `failed_when: false` keeps the task from stopping
      # the play before that report exists.
      failed_when: false
      retries: 6
      delay: 10
      until: _wbparser_catalog_probe.stdout | trim == '200'
      no_log: true
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Report what the catalog answered
      ansible.builtin.fail:
        msg: >-
          The catalog answered {{ _wbparser_catalog_probe.stdout | trim }} for
          /api/catalog/v1/ready — it should be 200. A 503 means the catalog's
          own database pool cannot reach the schema the projection expects; a
          401 means the key this deploy carries is not the one the application
          accepted; a 000 means the request never arrived.
      when:
        - wbparser_hostname | length > 0
        - _wbparser_catalog_probe.stdout | trim != '200'
      tags: [caddy_routes]

    - name: Remove the route
      ansible.builtin.file:
        path: "{{ caddy_conf_d }}/{{ wbparser_route_name }}.caddy"
        state: absent
      notify: Reload Caddy
      when: wbparser_hostname | length == 0
      tags: [caddy_routes]

  # Declared here because handlers are only loaded from roles that RUN, and the
  # caddy role deliberately is not in this play — its tasks are imported one file
  # at a time. The body is the same command as roles/caddy/handlers/main.yml; it
  # is needed only for the route-removal path above, which has to reload Caddy
  # after deleting the file.
  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ caddy_container }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
      changed_when: true
