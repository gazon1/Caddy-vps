---
# Two jobs: static checks (lint + syntax) and the lab suite, which exercises
# the role against a throwaway proxy in Docker.
#
# The lab runs here on every push — see the `lab:` job below. It needs no VPS,
# never contacts ACME, and works on non-standard ports under /tmp, so there is
# nothing to be gained by making it manual.
#
# (An earlier version of this comment claimed the lab was manual-only while a
# `lab:` job already ran it, which is how the workflow sat broken on a deleted
# branch for as long as it did.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core, ansible-lint and yamllint
        run: pip install --disable-pip-version-check ansible-core ansible-lint yamllint requests

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: ansible-playbook --syntax-check site.yml playbooks/status.yml playbooks/cert-check.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  lab:
    # The real test. Runs the role against a throwaway proxy on non-standard
    # ports under /tmp — no VPS involved and ACME is never contacted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core, ansible-lint, yamllint and requests
        run: pip install --disable-pip-version-check ansible-core ansible-lint yamllint requests

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run the lab suite
        run: bash tests/lab.sh
