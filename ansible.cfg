[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
display_skipped_hosts = False
forks = 10
timeout = 30
deprecation_warnings = False

# Vault password: set ANSIBLE_VAULT_PASSWORD_FILE in your shell profile.
#   echo 'export ANSIBLE_VAULT_PASSWORD_FILE=$PWD/.vault_pass' >> ~/.bashrc
# Create the password file:
#   echo "your-secret-password" > .vault_pass
# NEVER commit the actual password to git (.vault_pass is in .gitignore).

# Ansible runs on YOUR machine, not on the VPS. The VPS only needs the
# docker CLI and the compose v2 plugin — no Python, no Ansible.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s