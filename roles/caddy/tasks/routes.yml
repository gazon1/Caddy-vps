---
# Applies ONE route snippet from a file:
#
#   -e caddy_route_name=wb -e caddy_route_src=./site.caddy
#
# The snippet is an ordinary Caddyfile fragment, so TLS is whatever the
# snippet says it should be: omit `tls` for a Let's Encrypt certificate, or
# write `tls internal` for a self-signed one. Nothing is injected behind your
# back, and two projects can use different TLS modes side by side.

- name: Apply a route snippet
  when: caddy_route_name | length > 0
  block:

    - name: Validate the route snippet name
      ansible.builtin.assert:
        that:
          - caddy_route_name is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >-
          caddy_route_name must match ^[a-z0-9][a-z0-9-]*$ (lowercase letters,
          digits and dashes) so it cannot escape conf.d. Got
          '{{ caddy_route_name }}'.

    - name: Require a snippet source
      ansible.builtin.assert:
        that:
          - caddy_route_src | length > 0
        fail_msg: >-
          Nothing to apply: set caddy_route_src to a Caddyfile fragment.

    # caddy_route_src is a path on the CONTROL node, not on the target: the
    # "Install the snippet" copy below reads it from there. Checking it on the
    # managed host looks like it works and does not — the lab suite connects
    # with ansible_connection: local, so both sides are the same machine and
    # the distinction is invisible there. On a real host this fails with
    # "Route snippet source not found" for a file that is right there.
    #
    # A lookup rather than a delegated stat: delegate_to inherits the host's
    # become, and `-e ansible_become=true` (which is how this host is reached)
    # outranks a task-level `become: false`, so the delegated stat asks sudo
    # for a password on the control node. The lookup runs locally, needs no
    # privileges and cannot be redirected to the wrong machine.
    - name: Check that the source snippet exists on the control node
      ansible.builtin.set_fact:
        caddy_route_src_readable: >-
          {{ lookup('ansible.builtin.file', caddy_route_src, errors='ignore')
             | length > 0 }}

    - name: Fail when the source snippet is missing
      ansible.builtin.fail:
        msg: >-
          Route snippet source not readable on the control node:
          {{ caddy_route_src }}
      when: not caddy_route_src_readable | bool

    - name: Verify the proxy container is running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{.State.Running}}' }}"
          - "{{ caddy_container }}"
      register: caddy_container_state
      changed_when: false
      failed_when: caddy_container_state.rc != 0 or caddy_container_state.stdout != 'true'

    - name: Remember whether a previous version of this snippet exists
      ansible.builtin.stat:
        path: "{{ caddy_conf_d }}/{{ caddy_route_name }}.caddy"
      register: caddy_snippet_current

    # Backups are written by hand rather than with `backup: true`, because
    # Ansible names those <file>.<pid>.<date>@<time>~ which the rotation in
    # rotate.yml (and every operator's `ls`) would not recognise.
    - name: Compute the backup path for this apply
      ansible.builtin.set_fact:
        caddy_backup_path: >-
          {{ caddy_conf_d }}/{{ caddy_route_name }}.caddy.bak.{{ ansible_date_time.epoch }}

    - name: Keep the previous version as a backup
      ansible.builtin.copy:
        src: "{{ caddy_conf_d }}/{{ caddy_route_name }}.caddy"
        dest: "{{ caddy_backup_path }}"
        remote_src: true
        owner: "{{ caddy_owner }}"
        group: "{{ caddy_group }}"
        mode: "0644"
      when: caddy_snippet_current.stat.exists

    - name: Apply and validate
      block:

        - name: Install the snippet
          ansible.builtin.copy:
            src: "{{ caddy_route_src }}"
            dest: "{{ caddy_conf_d }}/{{ caddy_route_name }}.caddy"
            owner: "{{ caddy_owner }}"
            group: "{{ caddy_group }}"
            mode: "0644"
          notify: Reload Caddy

        - name: Validate the configuration with the new snippet in place
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ caddy_container }}"
              - caddy
              - validate
              - --config
              - /etc/caddy/Caddyfile
          register: caddy_snippet_validate
          changed_when: false

      rescue:

        - name: Restore the previous version of this snippet
          ansible.builtin.copy:
            src: "{{ caddy_backup_path }}"
            dest: "{{ caddy_conf_d }}/{{ caddy_route_name }}.caddy"
            remote_src: true
            owner: "{{ caddy_owner }}"
            group: "{{ caddy_group }}"
            mode: "0644"
          when: caddy_snippet_current.stat.exists

        # A snippet that did not exist before this run must be removed again —
        # there is no previous version to fall back to. A snippet that DID
        # exist keeps its restored content even when nothing changed.
        - name: Remove the newly created snippet
          ansible.builtin.file:
            path: "{{ caddy_conf_d }}/{{ caddy_route_name }}.caddy"
            state: absent
          when: not caddy_snippet_current.stat.exists

        - name: Re-validate after the rollback to tell the two failure cases apart
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ caddy_container }}"
              - caddy
              - validate
              - --config
              - /etc/caddy/Caddyfile
          register: caddy_rollback_validate
          changed_when: false
          failed_when: false

        - name: Report that this snippet was at fault
          ansible.builtin.fail:
            msg: >-
              Route snippet '{{ caddy_route_name }}' is invalid and has been rolled
              back to its previous version. The rest of the configuration is fine —
              the snippet above is what Caddy rejects:
              {{ caddy_snippet_validate.stderr | default('') | trim }}
          when: caddy_rollback_validate.rc == 0

        - name: Report that the breakage predates this run
          ansible.builtin.fail:
            msg: >-
              Route snippet '{{ caddy_route_name }}' was applied, but the resulting
              configuration is invalid AND the rolled-back one fails too. So the
              breakage predates this run and this snippet is not necessarily to
              blame. Check the other files in {{ caddy_conf_d }}:
              {{ caddy_rollback_validate.stderr | default('') | trim }}

    # ---------------------------------------------------------------------
    # Reachability probe — deliberately OUTSIDE the block/rescue above.
    #
    # Validation proves the configuration can be loaded; it says nothing about
    # whether the upstream exists. If that check lived inside the block, an
    # unreachable backend would trigger a rollback of a perfectly good snippet
    # and hide the actual problem behind a misleading "rolled back" message.
    #
    # curl rather than uri: curl can be told how to resolve an address
    # (--resolve), which also sets SNI correctly. A Host header alone is not
    # enough — Caddy picks the certificate by SNI, so the request would die in
    # the TLS handshake and tell you nothing.
    # ---------------------------------------------------------------------

    - name: Build the curl arguments for the probe
      # Built as a list rather than inline in the command, because dropping
      # entries from a YAML sequence is only reliable through `omit` — and
      # `omit` needs a literal placeholder, not a conditional value.
      #
      # The --resolve flag and its value are two separate entries, NOT one
      # "--resolve=host:port:addr" string. The joined form reached curl as an
      # unknown option on the GitHub runner:
      #   curl: option --resolve=lab.test:8444:127.0.0.1: is unknown
      # The same curl accepts both spellings from a shell, so this is about
      # how the argument is handed over, not what curl supports. See #8.
      ansible.builtin.set_fact:
        caddy_probe_argv: "{{ caddy_probe_base + caddy_probe_tls + caddy_probe_resolve }}"
      vars:
        caddy_probe_base: >-
          {{ ['curl', '--silent', '--show-error', '--output', '/dev/null',
              '--write-out', '%{http_code}',
              '--max-time', caddy_route_timeout | string, caddy_route_url] }}
        caddy_probe_tls: "{{ ['--insecure'] if caddy_route_insecure | bool else [] }}"
        caddy_probe_resolve: >-
          {{ ['--resolve', caddy_route_resolve]
             if caddy_route_resolve | length > 0 else [] }}

    - name: Probe the route end to end
      ansible.builtin.command:
        argv: "{{ caddy_probe_argv }}"
      register: caddy_route_probe
      changed_when: false
      failed_when: false
      when: caddy_route_url | length > 0

    # 2xx/3xx/4xx all mean the application answered, so routing works. curl
    # prints 000 when it never got a response at all — a dead TLS handshake, a
    # refused connection or a DNS failure all look like this.
    - name: Work out whether the route answered
      ansible.builtin.set_fact:
        caddy_route_status: "{{ caddy_route_probe.stdout | default('000') | trim }}"
      when: caddy_route_url | length > 0

    - name: Report an unreachable route
      ansible.builtin.fail:
        msg: >-
          The configuration was applied and validates, but {{ caddy_route_url }}
          did not answer — HTTP {{ caddy_route_status }}
          {{ '(' + probe_detail + ')' if probe_detail | default('') | length > 0 else '' }}.
          Caddy cannot load a broken configuration, but it will happily forward
          to an upstream that does not exist — that is the one class of mistake
          validation cannot catch. Check that the application container is
          running and is attached to the {{ caddy_network }} network under the
          exact name used in the snippet. If the request never reached Caddy at
          all, check DNS and the TLS handshake instead. The snippet has NOT been
          rolled back.
      vars:
        probe_detail: >-
          {{ caddy_route_probe.stderr | default('') | trim }}
      when:
        - caddy_route_url | length > 0
        - caddy_route_status | int < 200 or caddy_route_status | int >= 500
