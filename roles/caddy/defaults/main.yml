---
# Every value that can be overridden. Paths derived from caddy_base follow it
# automatically, so pointing the whole install somewhere else is a single -e.

# --- Where things live -------------------------------------------------------
caddy_base: /opt/caddy
caddy_conf_d: "{{ caddy_base }}/conf.d"
caddy_compose_file: "{{ caddy_base }}/docker-compose.caddy.yml"

# --- Docker topology ---------------------------------------------------------
caddy_network: caddy_net
caddy_container: caddy_global
caddy_image: caddy:2.8-alpine

# HOST ports. The container itself always listens on 80/443.
caddy_http_port: 80
caddy_https_port: 443

# --- Caddy behaviour ---------------------------------------------------------
caddy_acme_email: drobin.me@yandex.ru
caddy_admin_port: 2019
# `caddy reload` talks to the admin API over loopback *inside the container*,
# so the API never has to be reachable from the host. Turning this on binds the
# admin API to 0.0.0.0 inside the container and publishes it on host loopback.
caddy_publish_admin: false
caddy_admin_bind: "{{ '0.0.0.0' if caddy_publish_admin | bool else '127.0.0.1' }}"

# --- Operational knobs -------------------------------------------------------
caddy_backup_ttl: 5
caddy_health_timeout: 60

# Log retention for the proxy. It fronts every project on the host, so its
# logs are the only record of what it served.
caddy_log_max_size: 10m
caddy_log_max_file: 5

# Ownership of everything this role writes. root is correct for a production
# run; the local lab overrides both with the current user so it can run without
# sudo.
caddy_owner: root
caddy_group: root

# Drop all Linux capabilities and grant only NET_BIND_SERVICE. Worth keeping in
# production. The local lab turns it off: the container's root then has no
# CAP_DAC_OVERRIDE and cannot write into the lab directories, which are owned by
# an unprivileged user.
caddy_hardened_caps: true

# Format string for `docker inspect`, used by playbooks/status.yml. The braces
# are written as quoted literals so Ansible renders them rather than evaluating
# them, and the whole string is folded to keep it on one line.
caddy_inspect_format: >-
  {{ '{{.State.Status}}' }} health={{ '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' }}

# --- Route snippet to apply (empty = skip) -----------------------------------
# A route is always a file. TLS is whatever that file says it should be:
# omit `tls` for a Let's Encrypt certificate, write `tls internal` for a
# self-signed one. There is deliberately no global TLS switch — two projects
# can sit side by side using different modes.
caddy_route_src: ""
caddy_route_name: ""

# --- Optional post-apply reachability probe ----------------------------------
# `caddy validate` adapts the config; it does not exercise it. A snippet that
# points at an upstream that does not resolve passes validation and then fails
# every request. Set caddy_route_url to have the run actually check the route.
# Empty by default: the application is not always up yet when a route is
# registered, and a mandatory probe would fail for a reason that has nothing to
# do with the route being correct.
caddy_route_url: ""
caddy_route_timeout: 10
# Needed when probing a self-signed certificate (a snippet using `tls internal`).
caddy_route_insecure: false
# Optional curl --resolve value, e.g. "myproject.test:443:127.0.0.1", for when
# the site address in caddy_route_url does not resolve from the control node.
# A Host header is NOT a substitute: Caddy selects the certificate by SNI, so a
# request whose SNI does not match the site fails during the TLS handshake.
caddy_route_resolve: ""
