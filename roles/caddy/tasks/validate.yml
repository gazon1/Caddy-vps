---
# Hard gate. Nothing is reloaded until the configuration validates, so a broken
# edit can never take the running proxy down.

- name: Validate the Caddy configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ caddy_container }}"
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
  register: caddy_validate_result
  changed_when: false
  # В check mode команда не выполняется, а Caddyfile на хосте ещё старый:
  # валидировать было бы НЕ то, что изменится. Проверка пропускается явно,
  # чтобы сухой прогон не делал вид, что конфигурация проверена.
  when: not ansible_check_mode
