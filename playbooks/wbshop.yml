---
# ==============================================================================
# Deploy wbshop (product-catalog) with parser + migrations.
#
# This playbook deploys in order:
#   1. adsbrowser  — headless browser (if needed by parser)
#   2. wbparser    — parser container, with rollback on failure
#   3. Flyway      — baseline + migrate on shared DB (once, when needed)
#   4. wbshop      — product-catalog container
#   5. Caddy route — publish the route
#
# Usage:
#   just wbshop-deploy           # deploy current HEAD (from app repo)
#   ansible-playbook playbooks/wbshop.yml -e "wbparser_tag=<sha>" -e "wbshop_tag=<sha>"
#
# Required environment / variables:
#   wbparser_tag             — Docker image tag for parser
#   wbshop_tag               — Docker image tag for wbshop
#   WBPARSER_COMPOSE_SRC    — path to parser's deploy/docker-compose.vps.yml
#   WBSHOP_COMPOSE_SRC      — path to wbshop's docker-compose.yml
#   WBSHOP_ROUTE_SRC        — path to wbshop's deploy/caddy.conf.caddy
#                              (the site's own route file; the address and the
#                              public URL are read out of it)
#   WBPARSER_DB_PASSWORD    — database password
#   WBPARSER_ADMIN_PASSWORD — admin password
#   WBPARSER_ADMIN_API_KEY  — admin API key (used for adsbrowser when adspower_enabled=true)
#   WBPARSER_CATALOG_API_KEY — the key the site reads the catalog with
#
# Optional variables:
#   adspower_enabled         — set false to skip adsbrowser (default: true)
#
# The Caddy-vps directory convention: roles own the logic, playbooks wire them.
# ==============================================================================

- name: Deploy adsbrowser headless browser
  hosts: "{{ 'vps' if (adspower_enabled | default(true) | bool) else 'none' }}"
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true

  vars:
    adsbrowser_api_key: "{{ lookup('env', 'WBPARSER_ADMIN_API_KEY') | default('', true) }}"

  roles:
    - role: adsbrowser
      tags: [adsbrowser]

- name: Deploy wb-parser crawler
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"

  vars:
    wbparser_compose_src: >-
      {{ lookup('env', 'WBPARSER_COMPOSE_SRC') | default('', true) }}
    caddy_route_name: "{{ wbparser_route_name }}"
    caddy_route_url: "{{ wbparser_route_url }}"

  roles:
    - role: wbparser
      tags: [wbparser]

  tasks:
    - name: Render the wb-parser route snippet
      ansible.builtin.set_fact:
        caddy_route_content: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../roles/wbparser/templates/Caddyfile.snippet.j2') }}
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Apply the route
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/routes.yml"
      when: wbparser_hostname | length > 0
      tags: [caddy_routes]

    - name: Remove the route
      ansible.builtin.file:
        path: "{{ caddy_conf_d }}/{{ wbparser_route_name }}.caddy"
        state: absent
      notify: Reload Caddy
      when: wbparser_hostname | length == 0
      tags: [caddy_routes]

  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ caddy_container }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
      changed_when: true

- name: Run Flyway migrations on the shared database
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [flyway]

  vars:
    # Database on the shared DB host
    flyway_db_host: "{{ wbparser_db_host }}"
    flyway_db_port: "{{ wbparser_db_port }}"
    flyway_db_name: "{{ wbparser_db_name }}"
    flyway_db_user: "{{ wbparser_db_user }}"
    flyway_db_password: "{{ lookup('env', 'WBPARSER_DB_PASSWORD') }}"
    flyway_container: "wb-parser"
    flyway_jar_path: "/app/app.jar"

  tasks:
    - name: Verify parser container is running
      ansible.builtin.command:
        argv: [docker, inspect, "{{ flyway_container }}"]
      register: _flyway_parser_inspect
      changed_when: false
      failed_when: _flyway_parser_inspect.rc != 0

    - name: Check if Flyway baseline is needed
      block:
        - name: Run Flyway info to check schema state
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - info
          register: _flyway_info
          changed_when: false
          failed_when: false

        - name: Parse Flyway info output
          ansible.builtin.set_fact:
            _flyway_schema_count: >-
              {{ _flyway_info.stdout_lines
                 | select('search', 'Schema [^ ]* table') | list | length }}

        - name: Show current Flyway state
          ansible.builtin.debug:
            msg: "Flyway schema count: {{ _flyway_schema_count }}"
      rescue:
        - name: Report Flyway check failed
          ansible.builtin.debug:
            msg: "Flyway info failed — database may need baseline manually"

    - name: Run Flyway baseline (for non-empty legacy schema)
      when: _flyway_schema_count | default(0) | int == 0
      block:
        - name: Run Flyway baseline
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - baseline
              - -baselineVersion=1
              - -baselineDescription="Legacy NET schema baseline"
          register: _flyway_baseline
          changed_when: true

        - name: Show baseline result
          ansible.builtin.debug:
            msg: "{{ _flyway_baseline.stdout }}"

        - name: Run Flyway migrate after baseline
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ flyway_container }}"
              - java
              - -cp
              - "{{ flyway_jar_path }}"
              - org.flywaydb.commandline.Main
              - migrate
          register: _flyway_migrate
          changed_when: true

        - name: Show migrate result
          ansible.builtin.debug:
            msg: "{{ _flyway_migrate.stdout }}"

    - name: Run Flyway migrate (already baselined)
      when: _flyway_schema_count | default(0) | int > 0
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ flyway_container }}"
          - java
          - -cp
          - "{{ flyway_jar_path }}"
          - org.flywaydb.commandline.Main
          - migrate
      register: _flyway_migrate
      changed_when: true

    - name: Show Flyway result
      ansible.builtin.debug:
        msg: "{{ _flyway_migrate.stdout }}"

- name: Deploy wbshop (product-catalog)
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [wbshop]

  vars:
    # Image
    wbshop_registry: "ghcr.io"
    wbshop_image_owner: "gazon1"
    wbshop_image_name: "product-catalog"

    # Paths on VPS
    wbshop_base: "/opt/wbshop"
    wbshop_compose_file: "{{ wbshop_base }}/docker-compose.yml"
    wbshop_env_file: "{{ wbshop_base }}/.env"
    wbshop_state_file: "{{ wbshop_base }}/.deployed-tag"
    wbshop_app_env_file: "{{ wbshop_base }}/app.env"

    # Compose source (control machine)
    wbshop_compose_src: >-
      {{ lookup('env', 'WBSHOP_COMPOSE_SRC') | default('', true) }}

    # Container
    wbshop_container_name: "product-catalog"

    # Health gate
    wbshop_health_timeout: 180
    wbshop_health_retries: 20
    wbshop_health_delay: 6

    # The site's route file — the storefront's own. The address and the public
    # URL are read out of it, so there is one place where the domain is
    # written down: the file the storefront's CI checksums against the server.
    wbshop_route_src: >-
      {{ lookup('env', 'WBSHOP_ROUTE_SRC') | default('', true) }}
    wbshop_route_address: >-
      {{ (lookup('ansible.builtin.file', wbshop_route_src, errors='ignore')
          | regex_search('(?m)^([^#\s][^\n{]*?)\s*\{', '\\1')
          | default('', true)).split(',')[0].strip() }}

    # Site URL (for canonical URLs, sitemap, etc.)
    #
    # ТОТ ЖЕ адрес, что в маршруте витрины, — он и берётся из маршрута.
    # Расхождение между ними даёт sitemap, полный ссылок в никуда, и
    # канонические теги, которые уводят посетителя не туда.
    wbshop_site_url: "https://{{ wbshop_route_address }}"

    # Ownership
    wbshop_owner: root
    wbshop_group: root

    # Caddy route
    wbshop_route_name: "product-catalog"

    # The key the site reads the catalog with. The same value the crawler's
    # catalog API is configured with — the crawler accepts a list, so a
    # rotation can add the new key there first and switch the site over
    # afterwards.
    wbshop_catalog_api_key: "{{ lookup('env', 'WBPARSER_CATALOG_API_KEY') | default('', true) }}"

  tasks:
    - name: Validate wbshop_tag is set
      ansible.builtin.assert:
        that:
          - wbshop_tag | length > 0
        fail_msg: >-
          wbshop_tag is empty. Pass the tag:
          ansible-playbook playbooks/wbshop.yml -e wbshop_tag=<sha>

    - name: Check that compose source exists
      ansible.builtin.set_fact:
        _wbshop_compose_readable: >-
          {{ lookup('ansible.builtin.file', wbshop_compose_src, errors='ignore')
             | length > 0 }}

    - name: Fail when compose source is missing
      ansible.builtin.fail:
        msg: >-
          wbshop_compose_src is not set or not readable.
          Set it with: -e wbshop_compose_src=/path/to/docker-compose.yml
      when: not (_wbshop_compose_readable | default(false) | bool)

    - name: Read currently deployed tag
      ansible.builtin.slurp:
        src: "{{ wbshop_state_file }}"
      register: _wbshop_state
      changed_when: false
      failed_when: false

    - name: Work out the previous tag
      ansible.builtin.set_fact:
        wbshop_previous_tag: >-
          {{ _wbshop_state.content | b64decode | trim
             if _wbshop_state.content is defined else '' }}

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ wbshop_base }}"
        state: directory
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0755"

    - name: Install the compose file
      ansible.builtin.copy:
        src: "{{ wbshop_compose_src }}"
        dest: "{{ wbshop_compose_file }}"
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0644"
      when: wbshop_compose_src | length > 0

    # The site's own compose reads `.env` and nothing else: `env_file: .env`.
    # The public URL and the catalog's address and key belong there, because
    # a variable in a file the compose does not read is a variable the site
    # never sees — and the site answers 503 without a key, and ships a sitemap
    # of localhost links without a URL.
    #
    # The content is assembled once and used twice: the rollback below
    # re-renders the same file, and a rollback that dropped the key would
    # bring back a site that cannot read the catalog.
    - name: Compose the site's environment
      ansible.builtin.set_fact:
        wbshop_env_content: |
          TAG={{ wbshop_tag }}
          IMAGE_OWNER={{ wbshop_image_owner }}
          NEXT_PUBLIC_SITE_URL={{ wbshop_site_url }}
          CRAWLER_API_URL=http://wb-parser:8080
          CRAWLER_API_KEY={{ wbshop_catalog_api_key }}
      no_log: true

    - name: Render .env with the tag, the address and the key
      ansible.builtin.copy:
        dest: "{{ wbshop_env_file }}"
        content: "{{ wbshop_env_content }}"
        owner: "{{ wbshop_owner }}"
        group: "{{ wbshop_group }}"
        mode: "0600"

    # The file `app.env` used to be written here is gone, and that is a fix,
    # not a loss: the site's compose reads `.env` and nothing else, so the
    # site never saw the variables that were in `app.env`. Among them was
    # NEXT_PUBLIC_SITE_URL — the site shipped a sitemap full of localhost
    # links — and DATABASE_URL, which the site no longer needs at all: it
    # reads the catalog over HTTP, under a key, and does not connect to
    # PostgreSQL.

    - name: Pull and start wbshop
      block:
        - name: Pull and start
          community.docker.docker_compose_v2:
            project_src: "{{ wbshop_base }}"
            files:
              - "{{ wbshop_compose_file | basename }}"
            state: present
            pull: always
            wait: true
            wait_timeout: "{{ wbshop_health_timeout }}"
          register: _wbshop_up

        - name: Confirm container reports healthy
          ansible.builtin.command:
            argv: [docker, inspect, "{{ wbshop_container_name }}"]
          register: _wbshop_inspect
          changed_when: false
          until: >-
            (((_wbshop_inspect.stdout | from_json | first).State.Health) or {}).get('Status', 'none') == 'healthy'
          retries: "{{ wbshop_health_retries }}"
          delay: "{{ wbshop_health_delay }}"

        - name: Record the tag that is now running
          ansible.builtin.copy:
            content: "{{ wbshop_tag }}\n"
            dest: "{{ wbshop_state_file }}"
            owner: "{{ wbshop_owner }}"
            group: "{{ wbshop_group }}"
            mode: "0644"

      rescue:
        - name: Collect logs from failed container
          ansible.builtin.command:
            argv: [docker, logs, --tail, "40", "{{ wbshop_container_name }}"]
          register: _wbshop_failed_logs
          changed_when: false
          failed_when: false

        - name: Fail when no previous tag to rollback to
          ansible.builtin.fail:
            msg: >-
              wbshop {{ wbshop_tag }} did not become healthy.
              This is the first deploy — nothing to roll back to.
              {{ '\n\nContainer logs:\n' }}
              {{ _wbshop_failed_logs.stdout }}
              {{ _wbshop_failed_logs.stderr }}
          when: wbshop_previous_tag | length == 0

        # Тот же файл и те же ключи — только с предыдущим тегом. Откат, который
        # переписал бы .env двумя строками, оставил бы сайт без ключа
        # каталога: контейнер поднялся, а читать каталог он не может.
        - name: Restore previous tag
          ansible.builtin.copy:
            dest: "{{ wbshop_env_file }}"
            content: "{{ wbshop_env_content | replace('TAG=' ~ wbshop_tag, 'TAG=' ~ wbshop_previous_tag) }}"
            owner: "{{ wbshop_owner }}"
            group: "{{ wbshop_group }}"
            mode: "0600"
          no_log: true

        - name: Restart with previous tag
          community.docker.docker_compose_v2:
            project_src: "{{ wbshop_base }}"
            files:
              - "{{ wbshop_compose_file | basename }}"
            state: present
            pull: always
            wait: true
            wait_timeout: "{{ wbshop_health_timeout }}"

        - name: Report rollback
          ansible.builtin.fail:
            msg: >-
              wbshop {{ wbshop_tag }} did not become healthy.
              Rolled back to {{ wbshop_previous_tag }}.
              {{ '\n\nContainer logs:\n' }}
              {{ _wbshop_failed_logs.stdout }}
              {{ _wbshop_failed_logs.stderr }}

    - name: Report what is deployed
      ansible.builtin.debug:
        msg:
          - "Image: {{ wbshop_registry }}/{{ wbshop_image_owner }}/{{ wbshop_image_name }}:{{ wbshop_tag }}"
          - "Site URL: {{ wbshop_site_url }}"
          - "Catalog: the crawler's HTTP API, not a database — the site does not connect to PostgreSQL"
          - "Rollback target: {{ wbshop_previous_tag }}"

- name: Apply Caddy route for wbshop
  hosts: vps
  become: "{{ ansible_become | default(false) }}"
  gather_facts: true
  tags: [caddy_routes]

  vars_files:
    - "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"

  vars:
    # The route is not written here. It is the storefront's own file
    # (deploy/caddy.conf.caddy in gazon1/product-catalog), and the storefront's
    # CI compares the copy on the server with that file by checksum. A second
    # copy of the same route in this repository would drift from it without
    # anyone noticing — and the checksum gate would catch the drift only after
    # the site had already been deployed with the wrong address.
    wbshop_route_src: >-
      {{ lookup('env', 'WBSHOP_ROUTE_SRC') | default('', true) }}

  tasks:
    - name: Require the site's route file
      ansible.builtin.assert:
        that:
          - wbshop_route_src | length > 0
        fail_msg: >-
          WBSHOP_ROUTE_SRC is not set. The site's route is the storefront's own
          file — deploy/caddy.conf.caddy in gazon1/product-catalog — and not a
          copy written in this repository. Point WBSHOP_ROUTE_SRC at that file.

    # Имя и источник маршрута задаются ЗДЕСЬ, на уровне задачи, а не в vars
    # плейбука. Причина — приоритет переменных в Ansible:
    #
    #   extra vars (-e) > vars задачи > vars блока > vars роли >
    #   include_vars > set_fact > vars плейбука > vars_files плейбука >
    #   умолчания роли
    #
    # vars_files этого плейбука подключает умолчания роли caddy, где
    # caddy_route_name: "" — «маршрута нет». Умолчания из vars_files
    # перебивают vars плейбука, поэтому объявленное там имя до routes.yml НЕ
    # доходило: первый блок routes.yml начинается с
    # `when: caddy_route_name | length > 0`, и при пустом имени весь блок
    # пропускался. Маршрут не появлялся на сервере, а выкат выглядел
    # успешным — контейнер поднялся, а пути к нему не было.
    # С маршрутом краулера было ровно то же, и починено в #16.
    - name: Apply the route
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../roles/caddy/tasks/routes.yml"
      vars:
        caddy_route_name: "{{ wbshop_route_name }}"
        caddy_route_src: "{{ wbshop_route_src }}"
      when: wbshop_route_src | length > 0

  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ caddy_container }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
      changed_when: true
