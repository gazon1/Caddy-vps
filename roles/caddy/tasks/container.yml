---
# `wait: true` blocks until the container reports healthy. The healthcheck in
# the compose manifest runs `caddy validate`, so this waits for a proxy that can
# actually start — unlike `docker compose wait`, which blocks until containers
# STOP and therefore hangs forever on a detached, long-running service.

- name: Ensure the proxy container is present and running
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_base }}"
    files:
      - "{{ caddy_compose_file | basename }}"
    state: present
    wait: true
    wait_timeout: "{{ caddy_health_timeout }}"
    pull: missing
  # В check mode compose не вызывается. `docker compose up --dry-run` требует,
  # чтобы сеть и сам compose-файл уже существовали, а в dry run их нет: файл
  # только показан в diff, сеть не создана. На пустом хосте такой прогон
  # падал бы с «network … declared as external, but could not be found».
  # Сухой прогон показывает, что изменится в файлах, — контейнер он не
  # поднимает.
  when: not ansible_check_mode
